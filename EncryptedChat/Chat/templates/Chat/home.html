<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MySite</title>
<style>
  :root {
    --primary: #6c5ce7;
    --primary-dark: #5443d6;
    --accent: #ffb400;
    --text: #1f2340;
    --muted: #7b7f9e;
    --danger: #e5484d;
    --success: #12a66a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    min-height: 100vh;
    color: #fff;
    background: radial-gradient(circle at 20% 20%, #4b3fd1 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, #00a8e8 0%, transparent 40%),
                #1b1f4b;
    background-attachment: fixed;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 40px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .logo { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  .nav-buttons button {
    margin-left: 10px; padding: 10px 22px; border-radius: 25px;
    font-size: 15px; cursor: pointer; transition: .25s; border: 2px solid transparent;
  }
  .btn-login { background: transparent; color: #fff; border-color: #fff !important; }
  .btn-login:hover { background: #fff; color: #1b1f4b; }
  .btn-register { background: var(--accent); color: #222; font-weight: 600; }
  .btn-register:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(255,180,0,.4); }
  .hero { text-align: center; padding: 130px 20px; }
  .hero h1 { font-size: 50px; margin-bottom: 16px; }
  .hero p { font-size: 18px; opacity: .85; }

  /* ===== Modal ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; justify-content: center; align-items: center; padding: 16px;
    background: rgba(10,12,40,.65);
    backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s;
  }
  .overlay.active { opacity: 1; visibility: visible; }
  /* Login = purple/cyan theme, Register = pink/orange theme */
  #loginModal    { --c1: #7f5af0; --c2: #00c2ff; --glow: 127,90,240; --bg1: #2b1d6e; --bg2: #123a78; }
  #registerModal { --c1: #ff4d8d; --c2: #ff9f1c; --glow: 255,77,141; --bg1: #6b1d52; --bg2: #7a3410; }

  .modal {
    position: relative; width: 100%; max-width: 410px;
    background:
      radial-gradient(circle at 0% 0%, rgba(var(--glow),.45) 0%, transparent 55%),
      radial-gradient(circle at 100% 100%, var(--c2) 0%, transparent 60%),
      linear-gradient(145deg, var(--bg1), var(--bg2));
    color: #fff;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 22px; padding: 38px 32px 30px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 60px rgba(var(--glow),.35);
    transform: translateY(30px) scale(.95); transition: transform .3s cubic-bezier(.2,.9,.3,1.2);
    overflow: hidden;
  }
  .modal::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--accent));
  }
  .overlay.active .modal { transform: none; }
  .close {
    position: absolute; top: 14px; right: 14px; width: 34px; height: 34px;
    border: none; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff;
    font-size: 20px; cursor: pointer; transition: .2s;
  }
  .close:hover { background: rgba(255,255,255,.3); transform: rotate(90deg); }
  .modal-icon {
    width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff;
    box-shadow: 0 10px 28px rgba(var(--glow),.6), inset 0 0 0 1px rgba(255,255,255,.3);
  }
  .modal h2 { text-align: center; font-size: 26px; text-shadow: 0 2px 12px rgba(0,0,0,.3); }
  .modal .sub { text-align: center; color: rgba(255,255,255,.8); font-size: 14px; margin: 6px 0 22px; }

  .field { position: relative; margin-bottom: 14px; }
  .field svg.lead {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: rgba(255,255,255,.7); pointer-events: none; transition: .2s;
  }
  .field input {
    width: 100%; padding: 14px 44px 14px 42px; font-size: 15px; color: #fff;
    border: 1.5px solid rgba(255,255,255,.22); border-radius: 12px;
    background: rgba(255,255,255,.12); backdrop-filter: blur(6px); outline: none; transition: .2s;
  }
  .field input::placeholder { color: rgba(255,255,255,.65); }
  .field input:focus { border-color: #fff; background: rgba(255,255,255,.2); box-shadow: 0 0 0 4px rgba(var(--glow),.35); }
  .field input:focus ~ svg.lead { color: #fff; }
  .field input:-webkit-autofill {
    -webkit-text-fill-color: #fff; transition: background-color 9999s ease-in-out 0s;
  }
  .toggle-pw {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: rgba(255,255,255,.7); padding: 6px; display: flex;
  }
  .toggle-pw:hover { color: #fff; }
  .toggle-pw svg { width: 18px; height: 18px; }

  .msg { min-height: 20px; margin-bottom: 10px; font-size: 13.5px; text-align: center; font-weight: 500; }
  .msg.error { color: #ffd1d1; background: rgba(229,72,77,.35); border-radius: 8px; padding: 6px 10px; }
  .msg.success { color: #d5ffe9; background: rgba(18,166,106,.4); border-radius: 8px; padding: 6px 10px; }
  .msg:empty { background: none; padding: 0; }

  .submit {
    width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 16px; font-weight: 700; color: #1b1f4b;
    background: linear-gradient(135deg, #fff, #ffe9a8);
    box-shadow: 0 10px 24px rgba(0,0,0,.3); transition: .2s;
  }
  .submit:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0,0,0,.4), 0 0 24px rgba(var(--glow),.6); }
  .submit:disabled { opacity: .7; cursor: wait; transform: none; }

  .switch { text-align: center; margin-top: 18px; font-size: 14px; color: rgba(255,255,255,.8); }
  .switch a { color: #fff; font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .switch a:hover { color: var(--accent); }

  .shake { animation: shake .4s; }
  @keyframes shake { 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }

  @media (max-width: 520px) {
    header { padding: 14px 18px; }
    .hero h1 { font-size: 34px; }
    .modal { padding: 34px 22px 24px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">MySite</div>
  <div class="nav-buttons">
    <button class="btn-login" onclick="openModal('loginModal')">Log In</button>
    <button class="btn-register" onclick="openModal('registerModal')">Register</button>
  </div>
</header>

<section class="hero">
  <h1 id="heroTitle">Welcome to MySite</h1>
  <p id="heroSub">Log in or create an account to get started.</p>
</section>

<!-- Login -->
<div class="overlay" id="loginModal">
  <div class="modal">
    <button class="close" onclick="closeModal('loginModal')" aria-label="Close">&times;</button>
    <div class="modal-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2>Welcome Back</h2>
    <p class="sub">Apnar account-e log in korun</p>
    <form id="loginForm" data-url="{% url 'user_login' %}" novalidate>
      {% csrf_token %}
      <div class="field">
        <input type="email" name="email" placeholder="Email address" autocomplete="email" required>
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
      </div>
      <div class="field">
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <button type="button" class="toggle-pw" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="msg"></div>
      <button class="submit" type="submit">Log In</button>
    </form>
    <p class="switch">Account nai? <a onclick="swap('loginModal','registerModal')">Register korun</a></p>
  </div>
</div>

<!-- Register -->
<div class="overlay" id="registerModal">
  <div class="modal">
    <button class="close" onclick="closeModal('registerModal')" aria-label="Close">&times;</button>
    <div class="modal-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
    </div>
    <h2>Create Account</h2>
    <p class="sub">Kichukkhon-e notun account khulun</p>
    <form id="registerForm" data-url="{% url 'user_register' %}" novalidate>
      {% csrf_token %}
      <div class="field">
        <input type="text" name="name" placeholder="Full name" autocomplete="name" required>
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="field">
        <input type="email" name="email" placeholder="Email address" autocomplete="email" required>
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
      </div>
      <div class="field">
        <input type="password" name="password" placeholder="Password (min 8 character)" autocomplete="new-password" required>
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <button type="button" class="toggle-pw" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="field">
        <input type="password" name="confirm" placeholder="Confirm password" autocomplete="new-password" required>
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div class="msg"></div>
      <button class="submit" type="submit">Create Account</button>
    </form>
    <p class="switch">Already account ache? <a onclick="swap('registerModal','loginModal')">Log In korun</a></p>
  </div>
</div>

<script>
  function updateCsrfToken(token) {
    document.querySelectorAll('[name="csrfmiddlewaretoken"]').forEach(input => {
      input.value = token;
      input.defaultValue = token;
    });
  }

  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  function swap(from, to) { closeModal(from); setTimeout(() => openModal(to), 150); }

  document.querySelectorAll('.overlay').forEach(o =>
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('active'); }));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
  });

  // Password show/hide
  document.querySelectorAll('.toggle-pw').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = btn.parentElement.querySelector('input');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  });

  async function submitAuthForm(form, e) {
    e.preventDefault();
    const msg = form.querySelector('.msg');
    const btn = form.querySelector('.submit');
    const modal = form.closest('.modal');
    const original = btn.textContent;
    msg.className = 'msg'; msg.textContent = '';

    if (![...form.elements].filter(el => el.name).every(el => el.value.trim())) {
      msg.className = 'msg error'; msg.textContent = 'Shob field puron korun.';
      modal.classList.remove('shake'); void modal.offsetWidth; modal.classList.add('shake');
      return;
    }

    btn.disabled = true; btn.textContent = 'Please wait...';
    try {
      const payload = Object.fromEntries(new FormData(form));
      delete payload.csrfmiddlewaretoken;
      const res = await fetch(form.dataset.url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': form.querySelector('[name="csrfmiddlewaretoken"]').value
        },
        credentials: 'same-origin',
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.csrf_token) updateCsrfToken(data.csrf_token);
      if (res.ok && data.ok) {
        msg.className = 'msg success'; msg.textContent = data.message;
        if (form.id === 'registerForm') {
          setTimeout(() => { form.reset(); msg.textContent = ''; swap('registerModal', 'loginModal'); }, 1200);
        } else {
          document.getElementById('heroTitle').textContent = data.message;
          document.getElementById('heroSub').textContent = 'Apni successfully log in korechhen.';
          setTimeout(() => { form.reset(); closeModal('loginModal'); }, 1000);
        }
      } else {
        msg.className = 'msg error'; msg.textContent = data.message || 'Kichu ekta vul hoyeche.';
        modal.classList.remove('shake'); void modal.offsetWidth; modal.classList.add('shake');
      }
    } catch (err) {
      msg.className = 'msg error'; msg.textContent = 'Server-e connect kora jachhe na.';
    } finally {
      btn.disabled = false; btn.textContent = original;
    }
  }

  function userLogin(event) {
    return submitAuthForm(document.getElementById('loginForm'), event);
  }

  function userRegister(event) {
    return submitAuthForm(document.getElementById('registerForm'), event);
  }

  document.getElementById('loginForm').addEventListener('submit', userLogin);
  document.getElementById('registerForm').addEventListener('submit', userRegister);
</script>
</body>
</html>
